<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel - Donation Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>🔧 Admin Panel</h1>
  <a href="index.html">← Back to Main Site</a>
</header>

<div class="container">

  <!-- Campaign Analytics -->
  <h2>📊 Campaign Analytics</h2>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Campaign</th>
          <th>Goal</th>
          <th>Raised</th>
          <th>Donations</th>
          <th>Progress</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="analyticsTable">
        <tr><td colspan="7">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- All Donations -->
  <h2>💰 All Donations</h2>
  <div style="margin-bottom:10px">
    <button class="btn btn-primary" style="width:auto" onclick="downloadCSV()">
      ⬇️ Download CSV
    </button>
  </div>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Donor Name</th>
          <th>Email</th>
          <th>Amount</th>
          <th>Campaign</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="allDonationsTable">
        <tr><td colspan="5">Loading...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="admin.js"></script>
</body>
</html>
